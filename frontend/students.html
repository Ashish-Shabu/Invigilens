<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InvigiLens | Student Management</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Ionicons -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <style>
        /* Specific Styles for Student Page */
        .classes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .class-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .class-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-blue);
        }

        .class-icon {
            font-size: 3rem;
            color: var(--accent-blue);
            margin-bottom: 10px;
        }

        .class-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .student-count {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 5px;
        }

        /* Student Grid */
        .students-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .student-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            text-align: center;
        }

        .student-photo {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #000;
        }

        .student-info {
            padding: 15px;
        }

        .student-name {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .student-roll {
            font-size: 0.85rem;
            color: var(--accent-green);
            background: rgba(16, 185, 129, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-block;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background-color: var(--card-bg);
            margin: 10% auto;
            padding: 30px;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 400px;
            position: relative;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            color: var(--text-secondary);
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-family: inherit;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .breadcrumb {
            color: var(--text-secondary);
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .breadcrumb span {
            cursor: pointer;
        }

        .breadcrumb span:hover {
            color: var(--text-primary);
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo">Invigi<span>Lens</span></div>

        <div class="nav-links">
            <a href="index.html">
                <ion-icon name="videocam-outline" style="margin-right: 10px;"></ion-icon> Live Monitor
            </a>
            <a href="alerts.html">
                <ion-icon name="alert-circle-outline" style="margin-right: 10px;"></ion-icon> Alert Review
            </a>
            <a href="students.html" class="active">
                <ion-icon name="people-outline" style="margin-right: 10px;"></ion-icon> Students
            </a>
            <a href="#">
                <ion-icon name="settings-outline" style="margin-right: 10px;"></ion-icon> Settings
            </a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="header">
            <h1>Student Management</h1>
            <button class="btn btn-accept" id="add-student-btn" style="display: flex; align-items: center; gap: 8px;">
                <ion-icon name="person-add-outline"></ion-icon> Add Student
            </button>
        </div>

        <!-- Breadcrumb (Hidden initially) -->
        <div id="breadcrumb" class="breadcrumb" style="display: none;">
            <span onclick="loadClassesView()">Classes</span>
            <ion-icon name="chevron-forward-outline"></ion-icon>
            <span id="current-class-name">Class 10A</span>
        </div>

        <!-- View 1: Classes Grid -->
        <div id="classes-view">
            <div class="classes-grid" id="classes-container">
                <!-- Data will be injected here -->
                <div style="text-align:center; grid-column:1/-1; color:var(--text-secondary);">Loading classes...</div>
            </div>
        </div>

        <!-- View 2: Students Grid (Hidden initially) -->
        <div id="students-view" style="display: none;">
            <div class="students-grid" id="students-container">
                <!-- Data will be injected here -->
            </div>
        </div>
    </div>

    <!-- Add Student Modal -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2 style="margin-top: 0; margin-bottom: 20px;">Add New Student</h2>

            <form id="addStudentForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="name" class="form-control" placeholder="e.g. Rahul Kumar" required>
                </div>

                <div class="form-group">
                    <label>Class Room</label>
                    <input type="text" name="className" id="modalClassName" class="form-control"
                        placeholder="e.g. CSE-A" required>
                    <!-- If opened from a class view, this should auto-fill -->
                </div>

                <div class="form-group">
                    <label>Registration Number (Unique ID)</label>
                    <input type="text" name="rollNo" class="form-control" placeholder="e.g. 101" required>
                </div>

                <div class="form-group">
                    <label>Student Photo</label>
                    <input type="file" name="photo" class="form-control" accept="image/*" required>
                </div>

                <button type="submit" class="btn btn-accept" style="width: 100%; margin-top: 10px;">Save
                    Student</button>
            </form>
        </div>
    </div>

    <script src="js/students.js"></script>
</body>

</html>
